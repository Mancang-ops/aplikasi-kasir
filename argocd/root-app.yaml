# App-of-Apps: the only thing applied by hand (kubectl apply -f argocd/root-app.yaml).
# It syncs everything else under argocd/: the AppProject, the ApplicationSet and
# the nginx-helm Applications.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/rudiyanto-anteraja/gitops-argocd-lab.git
    targetRevision: main
    path: argocd
    directory:
      recurse: true
      exclude: root-app.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: true, selfHeal: true}

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kasir-prod
resources:
  - ../../base
images:
  - name: localhost:5050/kasir
    newTag: "1.0.0"
replicas:
  - name: kasir
    count: 3
patches:
  - target: {kind: Ingress, name: kasir}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: kasir-prod.localtest.me

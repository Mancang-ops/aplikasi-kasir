apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kasir-dev
resources:
  - ../../base
  - feature-flags.yaml
  - sealedsecret-kasir-cloud.yaml
images:
  - name: localhost:5050/kasir
    newTag: "1.0.0"
replicas:
  - name: kasir
    count: 1
patches:
  - target: {kind: Ingress, name: kasir}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: kasir-dev.localtest.me

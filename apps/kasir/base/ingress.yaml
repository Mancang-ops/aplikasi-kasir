apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: kasir
spec:
  ingressClassName: traefik
  rules:
    - host: kasir.localtest.me        # patched per overlay
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: kasir, port: {name: http}}

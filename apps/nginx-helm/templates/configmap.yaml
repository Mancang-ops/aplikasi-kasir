apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-html
  labels: {{- include "nginx-helm.labels" . | nindent 4 }}
data:
  index.html: |
    <!doctype html><html><head><meta charset="utf-8"><title>nginx-helm {{ .Values.environment }}</title></head>
    <body style="font-family:system-ui;background:{{ .Values.color }};color:#fff;display:grid;place-items:center;height:100vh;margin:0">
    <div style="text-align:center"><h1>nginx-helm · {{ .Values.environment }}</h1>
    <p>{{ .Values.message }}</p><p>chart {{ .Chart.Version }} · replicas {{ .Values.replicaCount }}</p></div></body></html>
